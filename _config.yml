# Site
title: sysuTobo 的博客
subtitle: 工程笔记与杂谈
description: ''
keywords:
author: sysuTobo
language: zh-CN
timezone: Asia/Shanghai

# URL
# 项目站点：https://sysutobo.github.io/blog/
# 如果改用 sysuTobo.github.io 仓库做根站点，把 url 改成 https://sysutobo.github.io、root 改成 /
url: https://sysutobo.github.io/blog
root: /blog/
permalink: :year/:month/:day/:title/
permalink_defaults:
pretty_urls:
  trailing_index: true
  trailing_html: true

# Directory
source_dir: source
public_dir: public
tag_dir: tags
archive_dir: archives
category_dir: categories
code_dir: downloads/code
i18n_dir: :lang
skip_render:

# Writing
new_post_name: :year-:month-:day-:title.md
default_layout: post
titlecase: false
external_link:
  enable: true
  field: site
  exclude: ''
filename_case: 0
render_drafts: false
post_asset_folder: false
relative_link: false
future: true
highlight:
  enable: true
  line_number: false
  auto_detect: false
  tab_replace: ''
  wrap: true
  hljs: false

# Home page setting
index_generator:
  path: ''
  per_page: 10
  order_by: -date

# Category & Tag
default_category: 未分类
category_map:
tag_map:

# Date / Time format
date_format: YYYY-MM-DD
time_format: HH:mm:ss
updated_option: ''

# Pagination
per_page: 10
pagination_dir: page

# Extensions
theme: next

# Feed
feed:
  type: atom
  path: atom.xml
  limit: 20

# Deployment
deploy:
  type: git
  repo: https://github.com/sysuTobo/blog.git
  branch: gh-pages
  message: 'Site updated: {{ now(''YYYY-MM-DD HH:mm:ss'') }}'
